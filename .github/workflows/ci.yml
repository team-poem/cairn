name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check:boundaries
      - run: npm run check:language
      - run: npm run journal:check
      - run: npm run typecheck
      - run: npm run build
      - name: Workspace tests
        run: npm run test:workspace
      - name: Offline benchmark contract tests
        run: npm run test:bench

  # The in-page probe (#176) decides what a click resolves to by reading element boxes, hit tests
  # and computed overflow/position — answers only a layout engine has. jsdom returns zeros for all
  # of it, so a unit test can pin the script's text and still miss a wrong probe; three such bugs
  # shipped past a green suite before this job existed. Separate from `verify` so the pure suite
  # keeps its seconds-long feedback, and run against the runner's installed Chrome, which is the
  # browser this engine actually drives.
  probe-fixtures:
    name: Engine compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:browser -w cairn-engine
      - name: Install fixed browser driver
        run: npm install --prefix "${{ runner.temp }}/cairn-tools" --ignore-scripts --no-audit --no-fund chrome-devtools-mcp@1.3.0
      - name: Discover and replay local journeys
        env:
          CAIRN_MCP_ENTRY: ${{ runner.temp }}/cairn-tools/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js
        run: npm run test:compatibility -- "${{ runner.temp }}/cairn-compatibility"
      - name: Preserve compatibility results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}
          path: ${{ runner.temp }}/cairn-compatibility
          if-no-files-found: warn
          retention-days: 14

  # Prove that the published artifact can be embedded outside this workspace.
  package-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pnpm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm install --global pnpm@10
        if: matrix.package-manager == 'pnpm'
      - run: npm ci
      - run: npm run test:consumer -- ${{ matrix.package-manager }}
