<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude: 42 LLM calls versus 7 over six checkout runs</title>
  <desc id="desc">Sonnet 5 · Opus 5. Each model used 42 calls for six discoveries and 7 calls for one discovery followed by five replays. These are per-model totals, not a sum or average across models. Totals reported in the PR author's original README. Both provider charts use the same zero-based scale.</desc>
  <rect width="1200" height="260" rx="20" fill="#0b1019"/>
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="49" fill="#ffffff" font-size="30" font-weight="600">Claude</text>
    <text x="40" y="80" fill="#8fa0b8" font-size="20">Sonnet 5 · Opus 5</text>
    <text x="1160" y="52" text-anchor="end" fill="#8fa0b8" font-size="21">LLM calls / model · 6 runs</text>
    <line x1="310" y1="105" x2="310" y2="231" stroke="#8fa0b8"/>
    <text x="40" y="144" fill="#dce4ef" font-size="24">Discover every run</text>
    <rect x="310" y="113" width="760" height="44" rx="5" fill="#e0aa6e"/>
    <text x="1088" y="145" fill="#e0aa6e" font-size="30" font-weight="600">42</text>
    <text x="40" y="214" fill="#dce4ef" font-size="24">Discover + replay</text>
    <rect x="310" y="183" width="126.66666666666666" height="44" rx="5" fill="#7ddab0"/>
    <text x="454.66666666666663" y="215" fill="#7ddab0" font-size="30" font-weight="600">7</text>
  </g>
</svg>
