name: Prepare release

# Bumps the version on develop, writes the release entry, folds the cycle's journal entries into one
# archive, and opens the release pull request. Run it manually with the version to cut.
#
# It never touches main and never publishes. Merging the pull request it opens is what starts
# release.yml, so a human still decides that a release happens.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to cut, for example 2.10.0"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the version shape before anything moves
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Version must look like 2.10.0, got '$VERSION'"; exit 1 ;;
          esac
      - uses: actions/create-github-app-token@v3.2.0
        id: token
        with:
          client-id: ${{ secrets.CAIRN_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CAIRN_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: develop
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - name: Require journal generation to finish first
        uses: actions/github-script@v7
        with:
          script: |
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'journal-entry.yml', branch: 'develop', status, per_page: 1 });
              if (data.total_count) throw new Error('Journal entry is still running. Wait for it to finish, then rerun Prepare release.');
            }
      - name: Prepare or refresh the unpublished version
        id: prepare
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm run release:prepare -- "$VERSION"
          git add --intent-to-add -- packages/harness/package.json package-lock.json spec/journal
      - name: The result must pass the same checks as any other change
        run: |
          npm run check:language
          npm run journal:check
          npm run typecheck
          npm run build
          npm run test:workspace
          npm run test:bench
          npm run check:boundaries
      - name: Commit and push to develop
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "pingu-cairn[bot]"
          git config user.email "pingu-cairn[bot]@users.noreply.github.com"
          node scripts/release-push.mjs "$VERSION"
      - name: How long since a standing decision was written down
        id: standing
        run: |
          # Nothing updates state.md automatically, so the release is the moment to ask whether a
          # standing decision moved this cycle.
          SECONDS_AT=$(git log -1 --format=%ct -- spec/journal/state.md)
          echo "days=$(( ( $(date +%s) - SECONDS_AT ) / 86400 ))" >> "$GITHUB_OUTPUT"
          echo "last=$(git log -1 --format=%cs -- spec/journal/state.md)" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { ensureReleasePullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-pr.mjs`);
            const result = await ensureReleasePullRequest({ github, repo: context.repo, version: process.env.VERSION, previous: process.env.PREVIOUS, standingDays: process.env.STANDING_DAYS, standingLast: process.env.STANDING_LAST });
            core.notice(`${result.created ? 'Opened draft' : 'Preserved existing'} release pull request #${result.number}`);
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS: ${{ steps.prepare.outputs.previous }}
          STANDING_DAYS: ${{ steps.standing.outputs.days }}
          STANDING_LAST: ${{ steps.standing.outputs.last }}
