name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./packages/harness/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published
        id: check
        run: |
          if npm view "cairn-engine@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "already published — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.should_release == 'true'
        run: npm run build

      - name: Test
        if: steps.check.outputs.should_release == 'true'
        run: npm run test

      - name: Publish to npm
        if: steps.check.outputs.should_release == 'true'
        working-directory: packages/harness
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.check.outputs.should_release == 'true'
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists — skipping tag creation. Verify it points at this commit ($(git rev-parse HEAD))."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi
