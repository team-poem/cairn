<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cairn — the AI walks your app once; the test runs forever: free, deterministic, self-healing. discover, freeze, replay, self-heal.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1322"/>
      <stop offset="0.6" stop-color="#0b1019"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#eebd85" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#eebd85" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#eebd85" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <linearGradient id="stoneA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcc4d1"/>
      <stop offset="1" stop-color="#5f6a7e"/>
    </linearGradient>
    <linearGradient id="stoneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab3c2"/>
      <stop offset="1" stop-color="#566175"/>
    </linearGradient>
    <linearGradient id="stoneTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4cd9c"/>
      <stop offset="1" stop-color="#c48f52"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d2c"/>
      <stop offset="1" stop-color="#0b1019"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10182a"/>
      <stop offset="1" stop-color="#090d15"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fc"/>
      <stop offset="1" stop-color="#b9c6d8"/>
    </linearGradient>
  </defs>

  <style>
    /* Stones settle one by one, bottom to top — then the build replays every 16s,
       so a reader who scrolls in later still catches the cairn being stacked. */
    .stone { opacity: 0; transform: translateY(-16px); animation: settle 7s infinite; }
    .s1 { animation-delay: .08s } .s2 { animation-delay: .26s } .s3 { animation-delay: .44s }
    .s4 { animation-delay: .62s } .s5 { animation-delay: .82s }
    @keyframes settle {
      0%   { opacity: 0; transform: translateY(-16px); animation-timing-function: cubic-bezier(.2,.85,.3,1.18); }
      9%   { opacity: 1; transform: translateY(0); }
      84%  { opacity: 1; transform: translateY(0); animation-timing-function: ease-in; }
      91%  { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; transform: translateY(-16px); }
    }
    .shadow { opacity: 0; animation: shadowIn 7s ease-out .1s infinite; }
    @keyframes shadowIn {
      0% { opacity: 0; } 9% { opacity: .45; } 84% { opacity: .45; } 91% { opacity: 0; } 100% { opacity: 0; }
    }

    /* Once per cycle, a shooting star. */
    .shoot { opacity: 0; animation: shoot 7s linear 3s infinite; }
    @keyframes shoot {
      0%, 52% { opacity: 0; transform: translate(30px, -12px); }
      54%     { opacity: .85; }
      59%     { opacity: 0; transform: translate(-200px, 58px); }
      100%    { opacity: 0; }
    }

    /* The beacon breathes; two rings ripple out like a sonar ping — the marker doing its job. */
    .beacon { transform-box: fill-box; transform-origin: center; animation: breathe 5.2s ease-in-out 1.4s infinite alternate; }
    @keyframes breathe { from { opacity: .75; transform: scale(.96); } to { opacity: 1; transform: scale(1.05); } }
    .ring { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ping 4.4s ease-out 1.5s infinite; }
    .r2 { animation-delay: 3.7s }
    @keyframes ping {
      0% { transform: scale(.55); opacity: 0; }
      12% { opacity: .55; }
      70% { opacity: .08; }
      100% { transform: scale(1.45); opacity: 0; }
    }
    .peak { animation: glint 3.6s ease-in-out 1.6s infinite alternate; }
    @keyframes glint { from { opacity: .30; } to { opacity: .55; } }

    /* The trail's dots march toward the cairn — the path being followed, forever. */
    .trail { animation: march 2.6s linear infinite; }
    @keyframes march { from { stroke-dashoffset: 14; } to { stroke-dashoffset: 0; } }

    /* A few stars twinkle on their own clocks. */
    .tw  { animation: tw 3.8s ease-in-out infinite; }
    .tw2 { animation: tw 5.1s ease-in-out 1.2s infinite; }
    .tw3 { animation: tw 4.4s ease-in-out 2.3s infinite; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .75; } }
    .spark { animation: tw 4.8s ease-in-out .8s infinite; }

    /* A pulse travels down the pipeline: discover → freeze → replay → heal. */
    .flow { animation: flow 3s ease-in-out infinite; }
    .f2 { animation-delay: .45s } .f3 { animation-delay: .9s }
    @keyframes flow { 0%,100% { opacity: .3; } 18% { opacity: 1; } 40% { opacity: .3; } }
    .chip-replay { animation: alive 4.6s ease-in-out 1s infinite alternate; }
    @keyframes alive { from { opacity: .82; } to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .stone, .shadow, .ring { opacity: 1; transform: none; }
      .ring { opacity: .2; }
    }
  </style>

  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#9fb0c8">
    <circle class="tw" cx="92" cy="46" r="1.5" opacity="0.55"/>
    <circle cx="176" cy="92" r="1.1" opacity="0.4"/>
    <circle class="tw2" cx="257" cy="38" r="1.3" opacity="0.5"/>
    <circle cx="333" cy="70" r="1.0" opacity="0.35"/>
    <circle cx="58" cy="140" r="1.0" opacity="0.3"/>
    <circle class="tw3" cx="410" cy="44" r="1.2" opacity="0.35"/>
    <circle cx="540" cy="66" r="1.0" opacity="0.28"/>
    <circle class="tw2" cx="705" cy="38" r="1.3" opacity="0.35"/>
    <circle cx="836" cy="72" r="1.0" opacity="0.3"/>
    <circle class="tw" cx="962" cy="40" r="1.4" opacity="0.45"/>
    <circle cx="1056" cy="84" r="1.1" opacity="0.35"/>
    <circle class="tw3" cx="1146" cy="52" r="1.5" opacity="0.5"/>
    <circle cx="1178" cy="150" r="1.0" opacity="0.25"/>
  </g>
  <!-- two brighter sparkles -->
  <g stroke="#cdd9ea" stroke-width="1" stroke-linecap="round">
    <g class="spark" opacity="0.55"><line x1="1104" y1="118" x2="1104" y2="128"/><line x1="1099" y1="123" x2="1109" y2="123"/></g>
    <g opacity="0.4"><line x1="368" y1="118" x2="368" y2="126"/><line x1="364" y1="122" x2="372" y2="122"/></g>
  </g>

  <!-- shooting star, once per cycle -->
  <g class="shoot">
    <line x1="880" y1="72" x2="948" y2="46" stroke="#dfe8f4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <circle cx="878" cy="73" r="2.2" fill="#f2f6fc"/>
  </g>

  <!-- layered ridges -->
  <path d="M0 268 L96 232 L190 260 L306 214 L420 258 L560 232 L700 262 L860 224 L1000 258 L1108 238 L1200 256 L1200 360 L0 360 Z" fill="url(#ridgeFar)" opacity="0.85"/>
  <path d="M0 300 L140 272 L300 300 L470 276 L640 302 L820 280 L990 302 L1200 282 L1200 360 L0 360 Z" fill="url(#ridgeNear)"/>

  <!-- the hill the cairn stands on -->
  <path d="M40 360 C 120 300, 330 300, 410 360 Z" fill="#0d1420"/>

  <!-- beacon glow + sonar rings around the marker stone -->
  <circle class="beacon" cx="218" cy="138" r="96" fill="url(#beacon)"/>
  <circle class="ring" cx="218" cy="136" r="34" stroke="#eebd85" stroke-width="1.5" fill="none"/>
  <circle class="ring r2" cx="218" cy="136" r="34" stroke="#eebd85" stroke-width="1.5" fill="none"/>

  <!-- the trail, found once — dots marching up to the cairn -->
  <path class="trail" d="M26 344 C 96 336, 120 312, 168 296" stroke="#cf9b5e" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 13"/>

  <!-- the cairn — stones settle bottom-up on load -->
  <g>
    <ellipse class="shadow" cx="222" cy="308" rx="96" ry="18" fill="#000000"/>
    <g class="stone s1">
      <g transform="rotate(-2 222 288)">
        <ellipse cx="222" cy="288" rx="88" ry="27" fill="url(#stoneA)"/>
        <ellipse cx="203" cy="280" rx="47" ry="10" fill="#ffffff" opacity="0.10"/>
      </g>
    </g>
    <g class="stone s2">
      <g transform="rotate(1.6 214 246)">
        <ellipse cx="214" cy="246" rx="69" ry="23" fill="url(#stoneB)"/>
        <ellipse cx="197" cy="239" rx="36" ry="8" fill="#ffffff" opacity="0.10"/>
      </g>
    </g>
    <g class="stone s3">
      <g transform="rotate(-1.6 226 208)">
        <ellipse cx="226" cy="208" rx="54" ry="20" fill="url(#stoneA)"/>
        <ellipse cx="213" cy="202" rx="28" ry="7" fill="#ffffff" opacity="0.12"/>
      </g>
    </g>
    <g class="stone s4">
      <g transform="rotate(2 212 174)">
        <ellipse cx="212" cy="174" rx="41" ry="17" fill="url(#stoneB)"/>
        <ellipse cx="202" cy="169" rx="21" ry="6" fill="#ffffff" opacity="0.13"/>
      </g>
    </g>
    <g class="stone s5">
      <g transform="rotate(-1 218 144)">
        <ellipse cx="218" cy="144" rx="28" ry="13" fill="url(#stoneTop)"/>
        <ellipse class="peak" cx="210" cy="140" rx="14" ry="4.5" fill="#ffffff" opacity="0.30"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <text x="392" y="150" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="112" font-weight="700" fill="url(#mark)" letter-spacing="-4">cairn</text>

  <!-- tagline -->
  <text x="398" y="196" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#b7c2d3">The AI walks your app once.</text>
  <text x="398" y="230" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#b7c2d3">The test runs forever — <tspan fill="#8fe3bd">free</tspan>, <tspan fill="#cdd9ea">deterministic</tspan>, <tspan fill="#e8b077">self-healing</tspan>.</text>

  <!-- the loop, as a pipeline — a pulse travels along the arrows -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="398" y="266" width="126" height="38" rx="10" stroke="#e0aa6e" stroke-opacity="0.8" fill="#e0aa6e" fill-opacity="0.08"/>
    <text x="461" y="291" font-size="22" fill="#e8b077" text-anchor="middle">discover</text>
    <text x="461" y="330" font-size="16" fill="#93a0b4" text-anchor="middle">LLM · once</text>

    <text class="flow" x="546" y="291" font-size="22" fill="#8fa0b8">→</text>

    <rect x="576" y="266" width="102" height="38" rx="10" stroke="#7e8a9c" stroke-opacity="0.45" fill="#ffffff" fill-opacity="0.03"/>
    <text x="627" y="291" font-size="22" fill="#aeb6c2" text-anchor="middle">freeze</text>
    <text x="627" y="330" font-size="16" fill="#93a0b4" text-anchor="middle">plain JSON</text>

    <text class="flow f2" x="700" y="291" font-size="22" fill="#8fa0b8">→</text>

    <g class="chip-replay">
      <rect x="730" y="266" width="128" height="38" rx="10" stroke="#7ddab0" stroke-opacity="0.9" fill="#7ddab0" fill-opacity="0.10"/>
      <text x="794" y="291" font-size="22" fill="#8fe3bd" text-anchor="middle">replay ∞</text>
    </g>
    <text x="794" y="330" font-size="16" fill="#93a0b4" text-anchor="middle">no LLM · $0</text>

    <text class="flow f3" x="880" y="291" font-size="22" fill="#8fa0b8">→</text>

    <rect x="910" y="266" width="132" height="38" rx="10" stroke="#e0aa6e" stroke-opacity="0.55" stroke-dasharray="5 4" fill="#e0aa6e" fill-opacity="0.04"/>
    <text x="976" y="291" font-size="22" fill="#d8a26b" text-anchor="middle">self-heal</text>
    <text x="976" y="330" font-size="16" fill="#93a0b4" text-anchor="middle">LLM · one step</text>
  </g>

  <rect x="0" y="0" width="1200" height="360" rx="20" fill="url(#vig)"/>
</svg>
