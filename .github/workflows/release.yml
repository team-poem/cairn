name: release

on:
  push:
    branches: [main]
  # Re-run by hand to mirror an already released version to GitHub Packages; npm, the tag and
  # the release are each skipped when they already exist.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(node -p "require('./packages/harness/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published
        id: check
        run: |
          if npm view "cairn-engine@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "already published — skipping release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub Packages only lists scoped names, so the same build is mirrored there as
      # @team-poem/cairn-engine. That is what makes the package show on the repository page;
      # npm stays the registry people install from.
      - name: Authenticate to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm config set //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"

      - name: Check if this version is already on GitHub Packages
        id: mirror
        run: |
          if npm view "@team-poem/cairn-engine@${{ steps.pkg.outputs.version }}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "already mirrored — skipping GitHub Packages"
            echo "should_mirror=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_mirror=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.should_release == 'true' || steps.mirror.outputs.should_mirror == 'true'
        run: npm run build

      - name: Test
        if: steps.check.outputs.should_release == 'true' || steps.mirror.outputs.should_mirror == 'true'
        run: npm run test

      - name: Publish to npm
        if: steps.check.outputs.should_release == 'true'
        working-directory: packages/harness
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Mirror to GitHub Packages
        if: steps.mirror.outputs.should_mirror == 'true'
        # A mirror failure must not stop the tag and the release; it shows as a warning instead.
        continue-on-error: true
        working-directory: packages/harness
        run: |
          cp package.json package.json.npm
          trap 'mv package.json.npm package.json' EXIT
          npm pkg set name=@team-poem/cairn-engine
          npm publish --registry=https://npm.pkg.github.com

      - name: Tag release
        if: steps.check.outputs.should_release == 'true'
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::warning::Tag $TAG already exists — skipping tag creation. Verify it points at this commit ($(git rev-parse HEAD))."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --draft --generate-notes --title "$TAG"
          fi
